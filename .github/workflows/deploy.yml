name: Deploy HelpD App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Node 18 reached end-of-life on 2025-04-30. Next.js 15 requires >=18.18;
        # Node 22 is the current LTS and matches local verification.
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Type check
      run: npx tsc --noEmit
    
    - name: Build application
      run: npm run build
    
    - name: Test build output
      run: |
        if [ -d ".next" ]; then
          echo "✅ Build successful - .next directory exists"
        else
          echo "❌ Build failed - .next directory missing"
          exit 1
        fi

  deploy-vercel:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Node 18 is EOL (2025-04-30) — keep in lockstep with the test job.
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
    
    - name: Deploy to Vercel
      # Skip rather than fail when the Vercel secrets are not configured.
      # Vercel's own GitHub integration already deploys every push to main
      # (see the "vercel[bot]" comment on the PR), so this step is a redundant
      # belt-and-braces deploy. Without this guard it hard-fails with
      # "Input required and not supplied: vercel-token" and marks the whole
      # run red on every push — a false failure that hides real breakage.
      if: ${{ secrets.VERCEL_TOKEN != '' && secrets.ORG_ID != '' && secrets.PROJECT_ID != '' }}
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        vercel-args: '--prod'

    - name: Note skipped Vercel deploy
      if: ${{ secrets.VERCEL_TOKEN == '' || secrets.ORG_ID == '' || secrets.PROJECT_ID == '' }}
      run: |
        echo "::notice title=Vercel deploy skipped::VERCEL_TOKEN / ORG_ID / PROJECT_ID are not set, so the CLI deploy step was skipped. Vercel's GitHub integration still deploys main automatically. To enable this step, add the three repository secrets."
